# Set UIGRAPH_TOKEN and UIGRAPH_GATEWAY_URL as repository variables.
# On hosted UIGraph, drop UIGRAPH_GATEWAY_URL and add --enterprise to each uigraph-cli command.

image: golang:1.23

pipelines:
  default:
    - step:
        name: UIGraph Sync
        script:
          - go install github.com/uigraph-oss/uigraph-cli
          - export PATH="$PATH:$(go env GOPATH)/bin"
          - uigraph-cli sync
        variables:
          UIGRAPH_TOKEN: $UIGRAPH_TOKEN
          UIGRAPH_GATEWAY_URL: $UIGRAPH_GATEWAY_URL

  tags:
    'v*':
      - step:
          name: UIGraph Release
          clone:
            depth: full
          script:
            - go install github.com/uigraph-oss/uigraph-cli
            - export PATH="$PATH:$(go env GOPATH)/bin"
            - uigraph-cli release
          variables:
            UIGRAPH_TOKEN: $UIGRAPH_TOKEN
            UIGRAPH_GATEWAY_URL: $UIGRAPH_GATEWAY_URL
