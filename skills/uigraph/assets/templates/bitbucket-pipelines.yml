# Set UIGRAPH_TOKEN and UIGRAPH_GATEWAY_URL as repository variables.
# On hosted UiGraph, drop UIGRAPH_GATEWAY_URL and add --enterprise to each uigraph command.

image: golang:1.23

pipelines:
  default:
    - step:
        name: UiGraph Sync
        script:
          - go install github.com/uigraph-oss/uigraph-cli
          - export PATH="$PATH:$(go env GOPATH)/bin"
          - uigraph sync
        variables:
          UIGRAPH_TOKEN: $UIGRAPH_TOKEN
          UIGRAPH_GATEWAY_URL: $UIGRAPH_GATEWAY_URL

  tags:
    'v*':
      - step:
          name: UiGraph Release
          clone:
            depth: full
          script:
            - go install github.com/uigraph-oss/uigraph-cli
            - export PATH="$PATH:$(go env GOPATH)/bin"
            - uigraph release
          variables:
            UIGRAPH_TOKEN: $UIGRAPH_TOKEN
            UIGRAPH_GATEWAY_URL: $UIGRAPH_GATEWAY_URL
