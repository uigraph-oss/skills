# Set UIGRAPH_TOKEN and UIGRAPH_GATEWAY_URL as CI/CD variables.
# On hosted UIGraph, drop UIGRAPH_GATEWAY_URL and add --enterprise to each uigraph-cli command.

uigraph-sync:
  stage: deploy
  image: golang:1.23
  script:
    - go install github.com/uigraph-oss/uigraph-cli
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - uigraph-cli sync
  only:
    - main
    - master
  variables:
    UIGRAPH_TOKEN: $UIGRAPH_TOKEN
    UIGRAPH_GATEWAY_URL: $UIGRAPH_GATEWAY_URL
  tags:
    - docker

uigraph-sync-dry-run:
  stage: test
  image: golang:1.23
  script:
    - go install github.com/uigraph-oss/uigraph-cli
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - uigraph-cli sync --dry-run
  only:
    - merge_requests
  variables:
    UIGRAPH_TOKEN: $UIGRAPH_TOKEN
    UIGRAPH_GATEWAY_URL: $UIGRAPH_GATEWAY_URL
  tags:
    - docker

uigraph-release:
  stage: deploy
  image: golang:1.23
  script:
    - go install github.com/uigraph-oss/uigraph-cli
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - uigraph-cli release
  only:
    - tags
  variables:
    UIGRAPH_TOKEN: $UIGRAPH_TOKEN
    UIGRAPH_GATEWAY_URL: $UIGRAPH_GATEWAY_URL
    GIT_DEPTH: 0
  tags:
    - docker
